
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #fff8e8;
      color: #493b2a;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo",
                   sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 30px 12px 24px;
    }

    .logo {
      font-size: 58px;
      line-height: 1.3;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(28px, 6vw, 42px);
      color: #67471f;
      line-height: 1.3;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #806d54;
      font-size: 17px;
    }

    .panel {
      background: #fffdf7;
      border: 2px solid #f2dfb1;
      border-radius: 24px;
      padding: 26px;
      margin-bottom: 22px;
      box-shadow: 0 6px 18px rgba(115, 83, 33, 0.06);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 25px;
      color: #67471f;
    }

    .hint {
      margin: 0 0 22px;
      color: #86745c;
      font-size: 15px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .mbti-button {
      min-height: 58px;
      border: 2px solid #f0d99e;
      border-radius: 14px;
      background: #fff4ce;
      color: #63471f;
      font-size: 19px;
      font-weight: 800;
      transition: transform 0.15s, background 0.15s;
    }

    .mbti-button:hover {
      background: #ffe69b;
      transform: translateY(-2px);
    }

    .mbti-button:focus-visible,
    .reset-button:focus-visible {
      outline: 3px solid #8c6429;
      outline-offset: 3px;
    }

    .result {
      display: none;
      text-align: center;
      animation: appear 0.35s ease;
    }

    .result.show {
      display: block;
    }

    .result-label {
      display: inline-block;
      padding: 5px 15px;
      background: #fff0bd;
      color: #805b20;
      border-radius: 999px;
      font-weight: 800;
      font-size: 15px;
    }

.pokemon-image-box {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 14px 0;
}

.pokemon-image {
  width: 240px;
  height: 240px;
  object-fit: contain;
  max-width: 100%;
}

    .pokemon-name {
      margin: 0;
      color: #67471f;
      font-size: clamp(29px, 6vw, 40px);
    }

    .pokemon-type {
      margin: 5px 0 20px;
      color: #967748;
      font-size: 16px;
    }

    .reason-box {
      padding: 20px;
      margin: 22px 0;
      border-radius: 18px;
      background: #fff5d9;
      text-align: left;
    }

    .reason-box h3 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #67471f;
    }

    .reason-box p {
      margin: 0;
      white-space: pre-line;
    }

    .compatibility {
      padding: 20px;
      border: 2px dashed #e8cb81;
      border-radius: 18px;
      background: #fffaf0;
    }

    .compatibility h3 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .compatibility .match {
      font-size: 28px;
      font-weight: 900;
      color: #8b6324;
    }

    .compatibility p {
      margin: 5px 0 0;
      color: #806d54;
      font-size: 15px;
    }

    .reset-button {
      margin-top: 24px;
      padding: 13px 28px;
      border: none;
      border-radius: 999px;
      background: #e8b94f;
      color: #493719;
      font-weight: 800;
      box-shadow: 0 4px 0 #c99b36;
      transition: transform 0.15s;
    }

    .reset-button:hover {
      background: #f2c968;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 12px;
      color: #9a876d;
      font-size: 13px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .panel {
        padding: 20px 15px;
        border-radius: 20px;
      }

      .mbti-grid {
        gap: 8px;
      }

      .mbti-button {
        min-height: 52px;
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    .pokemon-image-box {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 20px 0;
  min-height: 220px;
}

.pokemon-image {
  width: 220px;
  height: 220px;
  object-fit: contain;
}
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="logo" aria-hidden="true">⚡🌼</div>
      <h1>MBTI로 포켓몬 찾기</h1>
      <p class="subtitle">
        나와 닮은 포켓몬은 누구일까?<br>
        MBTI를 선택하고 나만의 포켓몬을 찾아봐!
      </p>
    </header>

    <section class="panel" id="selection">
      <h2>✨ 나의 MBTI는?</h2>
      <p class="hint">
        아래에서 자신의 MBTI 유형을 선택해 줘!
      </p>

      <div class="mbti-grid" id="mbtiGrid">
        <!-- MBTI 버튼이 자바스크립트로 만들어집니다. -->
      </div>
    </section>

    <section
      class="panel result"
      id="result"
      aria-live="polite"
      aria-atomic="true"
    >
      <span class="result-label" id="resultMbti"></span>

<div class="pokemon-image-box">
  <img
    id="pokemonImage"
    class="pokemon-image"
    src=""
    alt="선택한 포켓몬"
  >
</div>
      
      <h2 class="pokemon-name" id="pokemonName"></h2>
      <p class="pokemon-type" id="pokemonType"></p>

      <div class="reason-box">
        <h3>💛 나와 닮은 이유</h3>
        <p id="pokemonReason"></p>
      </div>

      <div class="compatibility">
        <h3>🤝 나와 잘 맞는 유형</h3>
        <div class="match" id="matchType"></div>
        <p id="matchReason"></p>
      </div>

      <button class="reset-button" id="resetButton">
        ↩ 다시 고르기
      </button>
    </section>

    <footer>
      ※ MBTI와 포켓몬의 연결은 재미를 위한 창작이며,
      실제 성격이나 궁합을 과학적으로 판단하는 기준은 아니야.
    </footer>
  </main>

  <script>
    // 16가지 MBTI와 포켓몬 정보를 저장합니다.
    const pokemonData = {
      "ISTJ": {
        name: "잠만보",
        emoji: "😴",
        type: "꾸준하고 믿음직한 현실주의자",
        reason: "자신만의 생활 리듬을 중요하게 생각해.\n차분하고 안정적인 모습이 믿음직한 잠만보와 닮았어.",
        match: "ESFP",
        matchReason: "차분함과 활발함이 만나 서로의 일상에 새로운 즐거움을 더할 수 있어."
      },
      "ISFJ": {
        name: "해피너스",
        emoji: "💗",
        type: "따뜻하고 다정한 수호자",
        reason: "다른 사람의 마음을 세심하게 살피는 편이야.\n주변을 돌보고 따뜻함을 나누는 해피너스와 잘 어울려.",
        match: "ESFP",
        matchReason: "서로를 배려하면서도 밝고 즐거운 시간을 함께 만들 수 있어."
      },
      "INFJ": {
        name: "가디안",
        emoji: "🌙",
        type: "깊이 생각하는 이상주의자",
        reason: "사람의 감정과 관계의 의미를 깊이 생각해.\n소중한 사람을 지키려는 가디안의 모습과 닮았어.",
        match: "ENFP",
        matchReason: "깊이 있는 생각과 자유로운 상상력이 만나 새로운 관점을 발견할 수 있어."
      },
      "INTJ": {
        name: "뮤츠",
        emoji: "🧠",
        type: "전략적인 계획가",
        reason: "목표를 정하고 논리적으로 해결책을 찾는 편이야.\n강한 지능과 독자적인 사고를 가진 뮤츠가 떠올라.",
        match: "ENFP",
        matchReason: "체계적인 계획과 창의적인 아이디어가 만나 서로의 시야를 넓힐 수 있어."
      },
      "ISTP": {
        name: "메타그로스",
        emoji: "🤖",
        type: "분석적이고 실용적인 해결사",
        reason: "문제가 생기면 직접 분석하고 해결하려고 해.\n뛰어난 계산 능력과 침착함을 지닌 메타그로스와 닮았어.",
        match: "ESTJ",
        matchReason: "실용적인 해결 능력과 체계적인 추진력이 만나 일을 효율적으로 해낼 수 있어."
      },
      "ISFP": {
        name: "이브이",
        emoji: "🦊",
        type: "유연하고 감성적인 탐험가",
        reason: "자신만의 취향과 감정을 소중하게 여겨.\n다양한 가능성을 지닌 이브이처럼 자신만의 길을 찾아가.",
        match: "ESFJ",
        matchReason: "자유로운 개성과 다정한 배려가 만나 편안한 관계를 만들 수 있어."
      },
      "INFP": {
        name: "쉐이미",
        emoji: "🌷",
        type: "순수한 마음의 이상주의자",
        reason: "자신의 가치관과 진심을 중요하게 생각해.\n자연과 생명을 아끼는 쉐이미의 따뜻한 모습과 닮았어.",
        match: "ENFJ",
        matchReason: "풍부한 내면과 따뜻한 표현력이 만나 서로의 꿈을 응원할 수 있어."
      },
      "INTP": {
        name: "메타몽",
        emoji: "🟣",
        type: "호기심 많은 사색가",
        reason: "새로운 원리를 탐구하고 다양한 가능성을 생각해.\n모습을 자유롭게 바꾸는 메타몽처럼 유연한 사고를 보여 줘.",
        match: "ENTJ",
        matchReason: "깊이 있는 분석과 실행력이 만나 아이디어를 실제 결과로 발전시킬 수 있어."
      },
      "ESTP": {
        name: "루카리오",
        emoji: "🥊",
        type: "대담하고 행동력 있는 모험가",
        reason: "직접 경험하면서 상황에 빠르게 대처하는 편이야.\n민첩하고 자신감 있는 루카리오의 모습이 잘 어울려.",
        match: "ISFJ",
        matchReason: "과감한 행동력과 세심한 배려가 만나 서로 부족한 부분을 보완할 수 있어."
      },
"ESFP": {
  name: "피카츄",
  image: "images/pikachu.png",
  type: "밝고 에너지 넘치는 분위기 메이커",
  reason: "사람들과 어울리며 즐거운 순간을 만드는 걸 좋아해.\n생기 넘치고 친근한 피카츄처럼 주변에 활력을 줄 수 있어.",
  match: "ISTJ",
  matchReason: "즉흥적인 즐거움과 안정적인 계획이 만나 균형 잡힌 시간을 보낼 수 있어."
},
      "ENFP": {
        name: "토게피",
        emoji: "🥚",
        type: "상상력 풍부한 긍정주의자",
        reason: "새로운 가능성을 발견하고 사람들과 아이디어를 나누는 편이야.\n호기심과 희망을 상징하는 토게피처럼 밝은 에너지를 전해.",
        match: "INFJ",
        matchReason: "자유로운 발상과 깊이 있는 통찰이 만나 서로에게 새로운 영감을 줄 수 있어."
      },
      "ENTP": {
        name: "팬텀",
        emoji: "👻",
        type: "재치 있고 도전적인 발명가",
        reason: "익숙한 생각에 질문을 던지고 색다른 방법을 찾아.\n장난기와 예측하기 어려운 매력을 가진 팬텀과 닮았어.",
        match: "INTJ",
        matchReason: "새로운 발상과 치밀한 전략이 만나 독창적인 아이디어를 발전시킬 수 있어."
      },
      "ESTJ": {
        name: "괴력몬",
        emoji: "💪",
        type: "책임감 있는 실행가",
        reason: "목표를 정하면 체계적으로 일을 추진하는 편이야.\n강한 힘과 성실함을 가진 괴력몬처럼 든든한 모습을 보여 줘.",
        match: "ISTP",
        matchReason: "계획을 세우는 능력과 현장에서 문제를 해결하는 능력이 서로 잘 어울려."
      },
      "ESFJ": {
        name: "푸린",
        emoji: "🎤",
        type: "친근하고 사교적인 조화주의자",
        reason: "사람들과 함께 즐거운 분위기를 만드는 걸 좋아해.\n노래로 마음을 전하는 푸린처럼 주변에 따뜻한 감정을 나눠.",
        match: "ISFP",
        matchReason: "사람을 향한 배려와 각자의 개성이 만나 편안하고 다정한 관계를 만들 수 있어."
      },
      "ENFJ": {
        name: "리자몽",
        emoji: "🔥",
        type: "열정적인 리더",
        reason: "다른 사람에게 동기를 주고 함께 성장하는 걸 중요하게 생각해.\n열정과 용기를 보여 주는 리자몽처럼 든든한 에너지를 발휘해.",
        match: "INFP",
        matchReason: "사람을 이끄는 열정과 진솔한 가치관이 만나 서로의 목표를 응원할 수 있어."
      },
      "ENTJ": {
        name: "망나뇽",
        emoji: "🐉",
        type: "결단력 있는 전략가",
        reason: "큰 목표를 세우고 주도적으로 해결책을 실행하는 편이야.\n강력한 능력과 든든함을 가진 망나뇽과 잘 어울려.",
        match: "INTP",
        matchReason: "빠른 실행력과 깊이 있는 분석이 만나 아이디어를 구체적인 계획으로 발전시킬 수 있어."
      }
    };

    const mbtiTypes = [
      "ISTJ", "ISFJ", "INFJ", "INTJ",
      "ISTP", "ISFP", "INFP", "INTP",
      "ESTP", "ESFP", "ENFP", "ENTP",
      "ESTJ", "ESFJ", "ENFJ", "ENTJ"
    ];

    const selection = document.getElementById("selection");
    const result = document.getElementById("result");
    const mbtiGrid = document.getElementById("mbtiGrid");

    // 16개의 MBTI 버튼을 자동으로 만듭니다.
    mbtiTypes.forEach(function(type) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "mbti-button";
      button.textContent = type;
      button.setAttribute("aria-label", type + " 유형 선택");

      button.addEventListener("click", function() {
        showResult(type);
      });

      mbtiGrid.appendChild(button);
    });

    // 선택한 MBTI의 포켓몬 결과를 화면에 표시합니다.
    function showResult(type) {
      const data = pokemonData[type];

      document.getElementById("resultMbti").textContent =
        "나의 MBTI · " + type;

const image = document.getElementById("pokemonImage");

image.src = data.image;
image.alt = data.name;

      document.getElementById("pokemonName").textContent =
        data.name;

      document.getElementById("pokemonType").textContent =
        data.type;

      document.getElementById("pokemonReason").textContent =
        data.reason;

      document.getElementById("matchType").textContent =
        data.match;

      document.getElementById("matchReason").textContent =
        data.matchReason;

      selection.style.display = "none";
      result.classList.add("show");

      // 결과가 나타나면 결과 제목으로 화면을 이동합니다.
      document.getElementById("resultMbti").focus?.();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 다시 고르기 버튼을 누르면 선택 화면으로 돌아갑니다.
    document.getElementById("resetButton").addEventListener(
      "click", function() {
        result.classList.remove("show");
        selection.style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    );
  </script>
</body>
</html>
